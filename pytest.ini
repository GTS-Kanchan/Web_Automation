[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
    --browser chromium

markers =
    smoke: Core smoke tests (fast, run on every build)
    regression: Full regression suite
    negative: Negative / boundary / security tests
    sms: SMS channel
    whatsapp: WhatsApp channel
    rcs: RCS channel
    email: Email channel
    common: Common / cross-channel suites (login, dashboard, contacts, etc.)
    campaign: Campaign feature area
    template: Template feature area
    sender_id: Sender ID feature area
    messaging: Messaging / message log feature area
    report: Reporting / analytics feature area
    opt_out: Opt-out / blocked-numbers feature area
    agent: RCS agent management feature area
    flow: WhatsApp/RCS Flow (Flow Builder) feature area
    opt_in: WhatsApp Opt-in Numbers feature area

# Channel/feature selection (pytest's -m marker expression is the
# equivalent of the spec's `--grep @sms` syntax):
#   pytest -m sms
#   pytest -m "sms and smoke"
#   pytest -m "sms or whatsapp"
# Path-based selection also works directly, no markers needed, since the
# suite is organized by channel folder:
#   pytest tests/sms
#   pytest tests/sms tests/whatsapp
