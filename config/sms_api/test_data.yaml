    from: "DUMMY"
    to:
      - "917002088565"
    # >160 chars so units should be > 1 for plain text
    text: "This is a deliberately long test message designed to exceed one hundred and sixty characters so that the API should report more than one unit consumed for this particular plain text SMS payload."
