send_msg:
  # This endpoint takes query params, not a JSON body. `params` here is a
  # Python list — api_client.send_msg() JSON-encodes it into the query
  # string automatically, matching the sample curl's
  # params=["test","test2","test2","test2"].
  valid_query_params:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "919550322394"
    params: ["test"]

  missing_campaign_id:
    phone: "919550322394"
    params: ["test", "test2", "test2", "test2"]

  missing_phone:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    params: ["test", "test2", "test2", "test2"]

  missing_params:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "919550322394"

  empty_params_array:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "919550322394"
    params: []

  invalid_phone_format:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "123"
    params: ["test", "test2", "test2", "test2"]

  non_numeric_phone:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "91ABCDEFGHIJ"
    params: ["test", "test2", "test2", "test2"]

  nonexistent_campaign_id:
    campaign_id: "00000000-0000-0000-0000-000000000000"
    phone: "919550322394"
    params: ["test", "test2", "test2", "test2"]

  malformed_campaign_id_format:
    campaign_id: "not-a-valid-uuid"
    phone: "919550322394"
    params: ["test", "test2", "test2", "test2"]

  extra_unexpected_query_param:
    campaign_id: "3e087f65-bf67-42ef-95c7-c37d5c28866f"
    phone: "919550322394"
    params: ["test", "test2", "test2", "test2"]
    unexpected_query_param: "should be ignored or rejected gracefully"

sms_json:
  # Mirrors the exact real-world sample payload: a `root` object supplies
  # default from/text/to, and `data` entries selectively override or omit
  # fields to inherit from root. Several entries are deliberately
  # incomplete on purpose (missing from/to/text) to exercise inheritance.
  real_sample_payload:
    root:
      from: "GTSTXT"
      text: "This is test message"
      to:
        - "919995628865"
    data:
      # Full override: own from/to/text, ignores root entirely.
      - from: "DUMMY"
        to:
          - "918993872333"
        text: "सुप्रभात! आज का दिन आपके जीवन में नई उम्मीद, नई ऊर्जा और नई संभावनाएँ लेकर आए।"
      # Only `to` given — from/text should inherit from root.
      - to:
          - "918999614820"
      # Full override including template_id.
      - from: "SMSOTP"
        to:
          - "918999614820"
        text: "Click on above link : cpaas.globeteleservices.com/AD-JIO/jio/{code}"
        template_id: "21345673212344342103"
      # Only `text` given — from/to should inherit from root.
      - text: "Please click on above link"
      # from/to/template_id given, no text — text should inherit from root.
      - from: "213443"
        to:
          - "918899776655"
        template_id: "45673212344342103"
      # Only `from` given — to/text should inherit from root.
      - from: "LSPSCA"

  # Simpler, single-entry version for quick smoke checks.
  minimal_valid_payload:
    root:
      from: "DUMMY"
      text: "Default root message."
      to:
        - "917002088565"
    data:
      - to:
          - "919990009990"

  missing_root_payload:
    data:
      - from: "DUMMY"
        to:
          - "917002088565"
        text: "No root object at all."

  missing_data_payload:
    root:
      from: "DUMMY"
      text: "Root with no data array."
      to:
        - "917002088565"

  empty_data_array_payload:
    root:
      from: "DUMMY"
      text: "Root present, data is empty."
      to:
        - "917002088565"
    data: []

  entry_with_no_inheritable_fields_at_all:
    # An entry that's just `{}` — everything should inherit from root.
    root:
      from: "DUMMY"
      text: "Fully inherited message."
      to:
        - "917002088565"
    data:
      - {}

  root_missing_from:
    root:
      text: "Root missing the from field."
      to:
        - "917002088565"
    data:
      - {}

  root_missing_text:
    root:
      from: "DUMMY"
      to:
        - "917002088565"
    data:
      - {}

  root_missing_to:
    root:
      from: "DUMMY"
      text: "Root missing the to field."
    data:
      - {}

  entry_invalid_number:
    root:
      from: "DUMMY"
      text: "Testing an invalid override number."
      to:
        - "917002088565"
    data:
      - to:
          - "123"

  entry_with_invalid_type_value:
    root:
      from: "DUMMY"
      text: "Testing invalid type on an entry."
      to:
        - "917002088565"
    data:
      - type: "X"

